<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMC-BCK — Kasuwa don kowa</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0F4C3A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink font-body">
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Real splash screen, matching the actual reference design exactly:
         real green background, the real UMC/BCK badge, the real
         Hausa translation, the real tagline — shown immediately while the
         app loads, then fades out once React has mounted. -->
    <div
      id="real-splash"
      style="
        position: fixed; inset: 0; z-index: 9999;
        background: #0F4C3A;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity 0.4s ease;
      "
    >
      <div style="width: 110px; height: 110px; background: #0F4C3A; border: 2px solid rgba(200,155,60,0.4); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; position: relative;">
        <span style="position: absolute; top: -8px; width: 70%; height: 12px; background: #EF9F27; border-radius: 6px;"></span>
        <span style="color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 1; margin-top: 10px;">UMC</span>
        <span style="width: 60px; height: 2px; background: #C89B3C; margin: 6px 0;"></span>
        <span style="color: #C89B3C; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; line-height: 1;">BCK</span>
      </div>
      <p style="color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin: 0;">UMC-BCK</p>
      <p style="color: #C89B3C; font-family: 'Inter', sans-serif; font-size: 13px; margin: 6px 0 0;">Unified Market Centre</p>
      <p style="color: #8CC8B4; font-family: 'Inter', sans-serif; font-size: 13px; margin: 2px 0 0;">Babbar Cibiyar Kasuwa</p>
      <p style="color: rgba(255,255,255,0.7); font-family: 'Inter', sans-serif; font-style: italic; font-size: 12px; margin: 20px 0 0;">Kasuwa don kowa — market for everyone</p>
      <div style="display: flex; gap: 6px; margin-top: 16px;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #C89B3C;"></span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #C89B3C;"></span>
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #C89B3C;"></span>
      </div>
      <p style="position: absolute; bottom: 24px; color: rgba(255,255,255,0.4); font-family: 'Inter', sans-serif; font-size: 11px;">Operated by Stadt-Thélima</p>
    </div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var splash = document.getElementById('real-splash')
          if (splash) {
            splash.style.opacity = '0'
            setTimeout(function () {
              splash.remove()
            }, 400)
          }
        }, 40000)
      })
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
